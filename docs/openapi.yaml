openapi: 3.1.0
info:
  title: YT Server API
  version: "1.0.0"
  description: |
    API-only backend for a YouTube-like video platform, built as the target API for an intern
    frontend assignment. See `PRD.md` and `ARCHITECTURE.md` in the repo root for the full design.

    Every response is wrapped in a common envelope:

    - Success: `{ "success": true, "data": ..., "meta"?: { page, limit, total, totalPages } }`
    - Error: `{ "success": false, "error": { "code", "message", "details"? } }`

    Send `Authorization: Bearer <accessToken>` on every endpoint except `/auth/login` and
    `/auth/refresh` and `/auth/logout`. There is no signup — accounts are created via
    `POST /admin/users` (admin only) or the one-time `npm run seed:admin` bootstrap script.
  license:
    name: UNLICENSED

servers:
  - url: /api/v1
    description: Same origin as this docs page

tags:
  - name: Auth
    description: Login, token refresh, logout. No signup.
  - name: Users
    description: Own profile and public channel profiles.
  - name: Videos
    description: Browse, watch, publish, and manage videos.
  - name: Reactions
    description: Like / dislike a video.
  - name: Comments
    description: Comment on videos.
  - name: Uploads
    description: >-
      Presigned S3 uploads — thumbnails and avatars (single PUT) and videos (resumable multipart).
  - name: Admin
    description: Account creation and analytics. Requires the ADMIN role.

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: admin@example.com
              password: change-me-please
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/AuthInvalidCredentials" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token for a new access + refresh token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: >-
            Refresh token invalid or expired (AUTH_REFRESH_TOKEN_INVALID), or an
            already-rotated token was replayed — every session for the user is revoked
            (AUTH_REFRESH_TOKEN_REUSED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /users/me:
    get:
      tags: [Users]
      summary: My profile
      responses:
        "200":
          description: My profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Update my channel name / avatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                channelName: { type: string, minLength: 2, maxLength: 100 }
                avatarKey:
                  type: string
                  nullable: true
                  description: S3 key from POST /uploads/avatars/presign — not a raw URL
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /users/{id}:
    get:
      tags: [Users]
      summary: Public channel profile
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/ChannelProfile" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /videos:
    get:
      tags: [Videos]
      summary: Home feed — paginated list of videos
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: sort
          in: query
          schema: { type: string, enum: [recent, popular], default: recent }
      responses:
        "200": { $ref: "#/components/responses/VideoList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Videos]
      summary: Publish a video (after uploading its bytes to S3 — see Uploads)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVideoRequest" }
      responses:
        "201":
          description: Video created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Video" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /videos/mine:
    get:
      tags: [Videos]
      summary: My own uploaded videos
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/VideoList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /videos/{id}:
    get:
      tags: [Videos]
      summary: Video detail (also records a view for the caller)
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Video detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/VideoDetail" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Videos]
      summary: Edit my video's metadata (owner only)
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVideoRequest" }
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Video" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Videos]
      summary: Delete a video (owner or admin — soft delete)
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /videos/{id}/recommended:
    get:
      tags: [Videos]
      summary: Recommended videos alongside this one
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Recommended videos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Video" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /videos/{id}/reaction:
    post:
      tags: [Reactions]
      summary: Like or dislike a video (upserts — swaps an existing reaction)
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [LIKE, DISLIKE] }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Reactions]
      summary: Remove my reaction from a video
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /videos/{id}/comments:
    get:
      tags: [Comments]
      summary: List comments on a video
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Comments]
      summary: Post a comment on a video
      parameters:
        - $ref: "#/components/parameters/VideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /comments/{id}:
    delete:
      tags: [Comments]
      summary: Delete a comment (author or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Comment not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /uploads/thumbnails/presign:
    post:
      tags: [Uploads]
      summary: Get a presigned URL to PUT a thumbnail image directly to S3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType]
              properties:
                fileName: { type: string }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
      responses:
        "200":
          description: Presigned PUT URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/PresignedUrl" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /uploads/avatars/presign:
    post:
      tags: [Uploads]
      summary: Get a presigned URL to PUT a new profile picture directly to S3
      description: >-
        Identical shape to the thumbnail presign — only the S3 key prefix differs. The returned
        `key` is what you send as `avatarKey` to `PATCH /users/me`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType]
              properties:
                fileName: { type: string }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
      responses:
        "200":
          description: Presigned PUT URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/PresignedUrl" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /uploads/videos/initiate:
    post:
      tags: [Uploads]
      summary: Start a resumable multipart video upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, fileSize, contentType]
              properties:
                fileName: { type: string }
                fileSize:
                  type: integer
                  description: Total file size in bytes
                contentType:
                  type: string
                  enum: [video/mp4, video/webm, video/quicktime, video/x-matroska]
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/InitiateUploadResponse" }
        "400":
          description: Validation error, or file exceeds MAX_VIDEO_SIZE_MB (code FILE_TOO_LARGE)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/S3Failed" }

  /uploads/videos/{uploadId}/parts/presign:
    post:
      tags: [Uploads]
      summary: Get presigned PUT URLs for one or more parts (call again after a pause/resume)
      parameters:
        - $ref: "#/components/parameters/UploadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partNumbers]
              properties:
                partNumbers:
                  type: array
                  items: { type: integer, minimum: 1, maximum: 10000 }
                  minItems: 1
      responses:
        "200":
          description: Presigned part URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PresignedPart" }
        "404": { $ref: "#/components/responses/UploadSessionNotFound" }
        "409": { $ref: "#/components/responses/UploadSessionInvalidState" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/S3Failed" }

  /uploads/videos/{uploadId}/parts:
    get:
      tags: [Uploads]
      summary: List parts S3 has already received (for resume after a pause/reload)
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Uploaded parts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UploadedPart" }
        "404": { $ref: "#/components/responses/UploadSessionNotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/S3Failed" }

  /uploads/videos/{uploadId}/complete:
    post:
      tags: [Uploads]
      summary: Finalize the multipart upload once every part has been PUT
      parameters:
        - $ref: "#/components/parameters/UploadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [partNumber, eTag]
                    properties:
                      partNumber: { type: integer, minimum: 1 }
                      eTag: { type: string }
      responses:
        "200":
          description: Upload completed — use videoKey in POST /videos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      videoKey: { type: string }
        "404": { $ref: "#/components/responses/UploadSessionNotFound" }
        "409": { $ref: "#/components/responses/UploadSessionInvalidState" }
        "400":
          description: Validation error, or parts don't match what S3 has (code UPLOAD_PART_MISMATCH)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/S3Failed" }

  /uploads/videos/{uploadId}/abort:
    post:
      tags: [Uploads]
      summary: Cancel an in-progress upload
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/UploadSessionNotFound" }
        "409": { $ref: "#/components/responses/UploadSessionInvalidState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/S3Failed" }

  /admin/users:
    post:
      tags: [Admin]
      summary: Create a new account (the only way to create accounts besides the bootstrap seed script)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string, minLength: 1, maxLength: 100 }
                role: { type: string, enum: [USER, ADMIN], default: USER }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/User" }
        "409":
          description: Email already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/videos/{id}/analytics:
    get:
      tags: [Admin]
      summary: Per-video stats — total views, unique viewers, likes, dislikes, comments
      parameters:
        - $ref: "#/components/parameters/VideoId"
      responses:
        "200":
          description: Video analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/VideoAnalytics" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/videos/{id}/views-by-day:
    get:
      tags: [Admin]
      summary: Views-by-day chart data (defaults to the last 30 days)
      parameters:
        - $ref: "#/components/parameters/VideoId"
        - name: from
          in: query
          description: ISO date, defaults to 30 days before `to`
          schema: { type: string, format: date }
        - name: to
          in: query
          description: ISO date, defaults to today
          schema: { type: string, format: date }
      responses:
        "200":
          description: Views by day
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ViewsByDayEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/VideoNotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Platform-wide totals
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/DashboardStats" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    VideoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Message:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageResponse" }
    VideoList:
      description: Paginated videos
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data:
                type: array
                items: { $ref: "#/components/schemas/Video" }
              meta: { $ref: "#/components/schemas/PaginationMeta" }
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Forbidden:
      description: Authenticated, but not allowed to do this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    AuthInvalidCredentials:
      description: Email/password didn't match
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    VideoNotFound:
      description: Video not found (or soft-deleted)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    UserNotFound:
      description: User not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    UploadSessionNotFound:
      description: Upload session not found, or not owned by the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    UploadSessionInvalidState:
      description: This upload was already completed or aborted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    S3Failed:
      description: Underlying S3 call failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }

  schemas:
    MessageResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            message: { type: string }

    ApiErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: VIDEO_NOT_FOUND }
            message:
              type: string
              example: "We couldn't find that video. It may have been removed."
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        channelName: { type: string }
        avatarKey: { type: string, nullable: true, description: "S3 key, not a URL — see /uploads/avatars/presign" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            user: { $ref: "#/components/schemas/User" }

    ChannelProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channelName: { type: string }
        avatarKey: { type: string, nullable: true, description: "S3 key, not a URL — see /uploads/avatars/presign" }
        videoCount: { type: integer }
        createdAt: { type: string, format: date-time }

    VideoCategory:
      type: string
      enum: [MUSIC, GAMING, EDUCATION, ENTERTAINMENT, SPORTS, TECHNOLOGY, NEWS, OTHER]

    VideoOwner:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channelName: { type: string }
        avatarKey: { type: string, nullable: true, description: "S3 key, not a URL — see /uploads/avatars/presign" }

    Video:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        videoKey: { type: string }
        thumbnailKey: { type: string }
        category: { $ref: "#/components/schemas/VideoCategory" }
        viewCount: { type: integer }
        likeCount: { type: integer }
        dislikeCount: { type: integer }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
        owner: { $ref: "#/components/schemas/VideoOwner" }

    VideoDetail:
      allOf:
        - $ref: "#/components/schemas/Video"
        - type: object
          properties:
            myReaction:
              type: string
              enum: [LIKE, DISLIKE]
              nullable: true

    CreateVideoRequest:
      type: object
      required: [title, description, videoKey, thumbnailKey]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        category: { $ref: "#/components/schemas/VideoCategory" }
        videoKey:
          type: string
          description: S3 key returned by the completed multipart upload
        thumbnailKey:
          type: string
          description: S3 key returned by the thumbnail presign

    UpdateVideoRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        category: { $ref: "#/components/schemas/VideoCategory" }
        thumbnailKey: { type: string }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/VideoOwner" }

    PresignedUrl:
      type: object
      properties:
        key: { type: string }
        url: { type: string, format: uri }

    InitiateUploadResponse:
      type: object
      properties:
        uploadId: { type: string, format: uuid }
        key: { type: string }
        partSize: { type: integer, description: Bytes per part }
        totalParts: { type: integer }

    PresignedPart:
      type: object
      properties:
        partNumber: { type: integer }
        url: { type: string, format: uri }

    UploadedPart:
      type: object
      properties:
        partNumber: { type: integer }
        eTag: { type: string }
        size: { type: integer, nullable: true }

    VideoAnalytics:
      type: object
      properties:
        videoId: { type: string, format: uuid }
        title: { type: string }
        totalViews: { type: integer }
        uniqueViewers: { type: integer }
        likeCount: { type: integer }
        dislikeCount: { type: integer }
        commentCount: { type: integer }

    ViewsByDayEntry:
      type: object
      properties:
        date: { type: string, example: "2026-08-10" }
        views: { type: integer }

    DashboardStats:
      type: object
      properties:
        totalUsers: { type: integer }
        totalVideos: { type: integer }
        totalViews: { type: integer }
